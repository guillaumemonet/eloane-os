title    Eloane - debug (logs detailles sur l'ecran et le port serie)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% nvidia_drm.modeset=1 console=ttyS0,115200 console=tty0 loglevel=7 systemd.show_status=1 systemd.journald.forward_to_console=1
